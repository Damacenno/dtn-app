services:
  react-native:
    build:
      context: .
      dockerfile: docker/react-native/Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "8081:8081"
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--reset-cache"]
    networks:
      - app-network

volumes:
  node_modules:

networks:
  app-network:
    driver: bridge
